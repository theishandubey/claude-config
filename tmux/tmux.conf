# Claude Code inside tmux (code.claude.com/docs/en/terminal-config#configure-tmux).
# Without passthrough, desktop notifications and the progress bar never leave tmux.
set -g allow-passthrough on
# Without extended keys, Shift+Enter submits instead of inserting a newline.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# The fullscreen renderer needs mouse mode, or wheel scrolling goes to tmux.
set -g mouse on
